version: '3.8'

networks:
  neruma_public:
    name: neruma_public
    driver: bridge
  neruma_internal:
    name: neruma_internal
    driver: bridge

volumes:
  traefik_acme:
  postgres_data:
  valkey_data:
  minio_data:
  typesense_data:
  uptime_data:

services:
  # ============================================================================
  # 1. REVERSE PROXY & TLS (Traefik v3)
  # ============================================================================
  traefik:
    image: traefik:v3.1
    container_name: neruma_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard em modo dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_acme:/letsencrypt
    networks:
      - neruma_public
    deploy:
      resources:
        limits:
          memory: 200M

  # ============================================================================
  # 2. BANCO DE DADOS (PostgreSQL 16 Multi-database)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: neruma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neruma_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neruma_secure_password_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
      POSTGRES_MULTIPLE_DATABASES: "medusa_db,payload_db,listmonk_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-postgres.sh:/docker-entrypoint-initdb.d/init-multi-postgres.sh:ro
    networks:
      - neruma_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neruma_admin} -d ${POSTGRES_DB:-medusa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1000M

  # ============================================================================
  # 3. CACHE & FILAS (Valkey 7.2 - BSD-3)
  # ============================================================================
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: neruma_valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - neruma_internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================================
  # 4. BUSCA RÁPIDA & SEMÂNTICA (Typesense - Lean para 8GB VPS)
  # ============================================================================
  typesense:
    image: typesense/typesense:27.1
    container_name: neruma_typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-neruma_typesense_secret_key_123}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.typesense.rule=Host(`search.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.typesense.entrypoints=web"
      - "traefik.http.services.typesense.loadbalancer.server.port=8108"
    deploy:
      resources:
        limits:
          memory: 400M

  # ============================================================================
  # 5. OBJECT STORAGE S3 (MinIO)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: neruma_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neruma_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neruma_minio_secret_password_123}
    volumes:
      - minio_data:/data
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    deploy:
      resources:
        limits:
          memory: 400M

  # ============================================================================
  # 6. COMMERCE ENGINE (Medusa v2 API & Admin)
  # ============================================================================
  medusa:
    build:
      context: ../apps/commerce
      dockerfile: ../../infra/docker/Dockerfile.commerce
    container_name: neruma_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neruma_admin}:${POSTGRES_PASSWORD:-neruma_secure_password_dev_2026}@postgres:5432/medusa_db
      REDIS_URL: redis://valkey:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_neruma_at_least_32_characters}
      COOKIE_SECRET: ${COOKIE_SECRET:-super_secret_cookie_key_neruma_at_least_32_chars}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://api.neruma.local}
      STORE_CORS: ${STORE_CORS:-http://localhost:3000,http://shop.neruma.local}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000,http://admin.neruma.local}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:3000,http://localhost:9000,http://shop.neruma.local,http://admin.neruma.local}
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.medusa.rule=Host(`api.${DOMAIN:-neruma.local}`, `admin.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.medusa.entrypoints=web"
      - "traefik.http.services.medusa.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits:
          memory: 1000M

  # ============================================================================
  # 7. HEADLESS CMS (Payload CMS 3.0)
  # ============================================================================
  payload:
    build:
      context: ../apps/cms
      dockerfile: ../../infra/docker/Dockerfile.cms
    container_name: neruma_payload
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-neruma_admin}:${POSTGRES_PASSWORD:-neruma_secure_password_dev_2026}@postgres:5432/payload_db
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-super_secret_payload_cms_key_32_chars_long}
      PORT: 3001
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payload.rule=Host(`cms.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.payload.entrypoints=web"
      - "traefik.http.services.payload.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 600M

  # ============================================================================
  # 8. STOREFRONT (Next.js 14/15 App Router)
  # ============================================================================
  storefront:
    build:
      context: ../apps/storefront
      dockerfile: ../../infra/docker/Dockerfile.storefront
    container_name: neruma_storefront
    restart: unless-stopped
    depends_on:
      - medusa
      - payload
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://api.neruma.local}
      NEXT_PUBLIC_PAYLOAD_URL: http://payload:3001
      NEXT_PUBLIC_TYPESENSE_HOST: typesense
      NEXT_PUBLIC_TYPESENSE_PORT: 8108
      NEXT_PUBLIC_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-neruma_typesense_secret_key_123}
      PORT: 3000
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storefront.rule=Host(`${DOMAIN:-neruma.local}`, `shop.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.storefront.entrypoints=web"
      - "traefik.http.services.storefront.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 600M

  # ============================================================================
  # 9. MONITORAMENTO & HEALTH (Uptime Kuma)
  # ============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: neruma_uptime
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    networks:
      - neruma_internal
      - neruma_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN:-neruma.local}`)"
      - "traefik.http.routers.uptime.entrypoints=web"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 200M

  # ============================================================================
  # 10. PRODUCT INTELLIGENCE LAYER (AI Worker)
  # ============================================================================
  ai-intel:
    build:
      context: ../services/ai-intel
      dockerfile: ../../infra/docker/Dockerfile.ai-intel
    container_name: neruma_ai_intel
    restart: unless-stopped
    depends_on:
      - medusa
      - valkey
    environment:
      REDIS_URL: redis://valkey:6379
      MEDUSA_API_URL: http://medusa:9000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINTEREST_ACCESS_TOKEN: ${PINTEREST_ACCESS_TOKEN}
    networks:
      - neruma_internal
    deploy:
      resources:
        limits:
          memory: 400M
